
                        <!DOCTYPE html>
                        <html lang="en">
                        <head>
                            <meta charset="UTF-8">
                            <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <style>
                body {
                  background-color: white; /* Ensure the iframe has a white background */
                }

                
              </style>
                        </head>
                        <body>
                            <a href="https://wa.me/${loja.zap}" target="_blank">💬 Pedir pelo WhatsApp</a>
<button onclick="abrirFormularioPedido('${loja.id}', '${loja.nome_loja}')" class="inline-block mt-6 bg-laranja hover:bg-orange-600 text-white px-8 py-4 rounded-full font-bold text-lg shadow-2xl">
  🛒 Fazer Pedido
</button>
<!-- Modal de Pedido -->
<div id="modal-pedido" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.8); z-index:1000; align-items:center; justify-content:center;">
  <div style="background:#121212; padding:2rem; border-radius:16px; max-width:500px; width:90%; max-height:90vh; overflow-y:auto;">
    <h2 style="color:#ff5500; margin-bottom:1rem;">Fazer Pedido</h2>
    <form id="form-pedido">
      <div style="margin-bottom:1rem;">
        <label style="color:#fff; display:block; margin-bottom:0.5rem;">Seu nome *</label>
        <input type="text" id="pedido-nome" required style="width:100%; padding:0.8rem; border-radius:8px; border:1px solid #1a0f2b; background:#0d0d0d; color:#fff;">
      </div>
      <div style="margin-bottom:1rem;">
        <label style="color:#fff; display:block; margin-bottom:0.5rem;">Telefone (WhatsApp)</label>
        <input type="tel" id="pedido-telefone" placeholder="(11) 99999-9999" style="width:100%; padding:0.8rem; border-radius:8px; border:1px solid #1a0f2b; background:#0d0d0d; color:#fff;">
      </div>
      <div style="margin-bottom:1rem;">
        <label style="color:#fff; display:block; margin-bottom:0.5rem;">O que você quer? *</label>
        <textarea id="pedido-itens" required rows="4" placeholder="Ex: 2 marmitas grandes, 1 refrigerante..." style="width:100%; padding:0.8rem; border-radius:8px; border:1px solid #1a0f2b; background:#0d0d0d; color:#fff; resize:vertical;"></textarea>
      </div>
      <div style="margin-bottom:1.5rem;">
        <label style="color:#fff; display:block; margin-bottom:0.5rem;">Observação</label>
        <textarea id="pedido-observacao" rows="2" placeholder="Ex: Sem cebola, entregar rápido..." style="width:100%; padding:0.8rem; border-radius:8px; border:1px solid #1a0f2b; background:#0d0d0d; color:#fff; resize:vertical;"></textarea>
      </div>
      <div style="display:flex; gap:1rem;">
        <button type="button" onclick="fecharFormularioPedido()" style="flex:1; padding:1rem; border-radius:8px; border:1px solid #1a0f2b; background:transparent; color:#fff; font-weight:bold; cursor:pointer;">Cancelar</button>
        <button type="submit" style="flex:1; padding:1rem; border-radius:8px; border:none; background:#ff5500; color:#fff; font-weight:bold; cursor:pointer;">Enviar Pedido</button>
      </div>
    </form>
  </div>
</div>

<script>
let lojaIdAtual = '';
let lojaNomeAtual = '';

function abrirFormularioPedido(lojaId, lojaNome) {
  lojaIdAtual = lojaId;
  lojaNomeAtual = lojaNome;
  document.getElementById('modal-pedido').style.display = 'flex';
}

function fecharFormularioPedido() {
  document.getElementById('modal-pedido').style.display = 'none';
  document.getElementById('form-pedido').reset();
}

document.getElementById('form-pedido').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const nome = document.getElementById('pedido-nome').value;
  const telefone = document.getElementById('pedido-telefone').value;
  const itens = document.getElementById('pedido-itens').value;
  const observacao = document.getElementById('pedido-observacao').value;
  
  try {
    const resposta = await fetch(WORKER_URL + '/api/pedido', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        loja_id: lojaIdAtual,
        nome_cliente: nome,
        telefone: telefone,
        itens: itens,
        observacao: observacao
      })
    });
    
    const dados = await resposta.json();
    
    if (dados.sucesso) {
      alert('✅ Pedido enviado!\n\nO dono da loja entrará em contato com você em breve pelo WhatsApp.');
      fecharFormularioPedido();
    } else {
      alert('❌ Erro: ' + (dados.erro || 'Tente novamente'));
    }
  } catch (erro) {
    alert('❌ Erro ao enviar pedido. Tente novamente.');
  }
});

// Fechar modal ao clicar fora
document.getElementById('modal-pedido').addEventListener('click', function(e) {
  if (e.target === this) fecharFormularioPedido();
});
</script>
<button data-nav="pedidos" data-goto="pedidos" class="nav-btn flex flex-col items-center gap-1 py-2 px-4 rounded-xl transition no-tap text-slate-400">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
  </svg>
  <span class="text-[11px] font-medium">Pedidos</span>
</button>
<div id="screen-pedidos" class="screen hidden w-full h-full overflow-y-auto scrollbar-hide bg-[#f8fafc]">
  <div class="px-5 pt-3 pb-28">
    <div class="flex items-center gap-3 mb-5">
      <button data-goto="home" class="w-9 h-9 rounded-xl bg-white border border-slate-200 flex items-center justify-center no-tap active:scale-95">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a2540" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <h2 class="text-[20px] font-bold text-[#0a2540]">Pedidos</h2>
    </div>

    <div class="bg-white rounded-[28px] p-5 shadow-sm border border-slate-100 mb-4">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-semibold text-[16px] text-[#0a2540]">Pedidos Novos</h3>
        <button onclick="carregarPedidos()" class="text-[#00c2a8] text-sm font-semibold">Atualizar</button>
      </div>
      <div id="lista-pedidos" class="space-y-3">
        <p class="text-center text-slate-500 py-8">Nenhum pedido novo</p>
      </div>
    </div>
  </div>
</div>


              <script>
                              // Rota para criar pedido
if (url.pathname === '/api/pedido' && request.method === 'POST') return await criarPedido(request, env);

// Rota para listar pedidos
if (url.pathname === '/api/pedidos' && request.method === 'GET') return await listarPedidos(request, env);

// Rota para atualizar status do pedido
if (url.pathname === '/api/pedido-status' && request.method === 'PUT') return await atualizarStatusPedido(request, env);

async function criarPedido(request, env) {
  try {
    const dados = await request.json();
    const { loja_id, nome_cliente, telefone, itens, observacao } = dados;
    
    if (!loja_id || !nome_cliente || !itens) {
      return new Response(JSON.stringify({ erro: 'Campos obrigatórios ausentes' }), {
        status: 400, headers: { 'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*' }
      });
    }
    
    const idPedido = 'ped_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    const agora = new Date().toISOString();
    
    await env.DB.prepare(`
      INSERT INTO pedidos (id, loja_id, nome_cliente, telefone, itens, observacao, status, data_criacao)
      VALUES (?, ?, ?, ?, ?, ?, 'novo', ?)
    `).bind(idPedido, loja_id, nome_cliente, telefone || '', itens, observacao || '', agora).run();
    
    return new Response(JSON.stringify({ sucesso: true, pedido_id: idPedido }), {
      status: 201, headers: { 'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*' }
    });
  } catch (erro) {
    return new Response(JSON.stringify({ erro: erro.message }), {
      status: 500, headers: { 'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*' }
    });
  }
}

async function listarPedidos(request, env) {
  try {
    const url = new URL(request.url);
    const lojaId = url.searchParams.get('loja_id');
    const status = url.searchParams.get('status') || 'novo';
    
    if (!lojaId) {
      return new Response(JSON.stringify({ erro: 'loja_id ausente' }), {
        status: 400, headers: { 'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*' }
      });
    }
    
    const pedidos = await env.DB.prepare(
      'SELECT * FROM pedidos WHERE loja_id = ? AND status = ? ORDER BY data_criacao DESC'
    ).bind(lojaId, status).all();
    
    return new Response(JSON.stringify({ sucesso: true, pedidos: pedidos.results || [] }), {
      status: 200, headers: { 'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*' }
    });
  } catch (erro) {
    return new Response(JSON.stringify({ erro: erro.message }), {
      status: 500, headers: { 'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*' }
    });
  }
}

async function atualizarStatusPedido(request, env) {
  try {
    const dados = await request.json();
    const { pedido_id, status } = dados;
    
    if (!pedido_id || !status) {
      return new Response(JSON.stringify({ erro: 'pedido_id e status obrigatórios' }), {
        status: 400, headers: { 'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*' }
      });
    }
    
    await env.DB.prepare(
      'UPDATE pedidos SET status = ? WHERE id = ?'
    ).bind(status, pedido_id).run();
    
    return new Response(JSON.stringify({ sucesso: true }), {
      status: 200, headers: { 'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*' }
    });
  } catch (erro) {
    return new Response(JSON.stringify({ erro: erro.message }), {
      status: 500, headers: { 'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*' }
    });
  }
}

// Carregar pedidos
async function carregarPedidos() {
  const lojaId = 'loja_demo'; // Substituir pelo ID real da loja
  const lista = document.getElementById('lista-pedidos');
  
  try {
    const resposta = await fetch(`https://microfood.hdmicro.workers.dev/api/pedidos?loja_id=${lojaId}&status=novo`);
    const dados = await resposta.json();
    
    if (dados.sucesso && dados.pedidos.length > 0) {
      lista.innerHTML = dados.pedidos.map(p => `
        <div class="bg-slate-50 rounded-2xl p-4 border border-slate-200">
          <div class="flex items-start justify-between mb-2">
            <div>
              <p class="font-semibold text-[#0a2540]">${p.nome_cliente}</p>
              <p class="text-xs text-slate-500">${p.telefone || 'Sem telefone'}</p>
            </div>
            <span class="text-xs text-slate-400">${new Date(p.data_criacao).toLocaleTimeString('pt-BR', {hour: '2-digit', minute:'2-digit'})}</span>
          </div>
          <div class="bg-white rounded-xl p-3 mb-3">
            <p class="text-sm text-[#0a2540] font-medium">${p.itens}</p>
            ${p.observacao ? `<p class="text-xs text-slate-500 mt-2">Obs: ${p.observacao}</p>` : ''}
          </div>
          <button onclick="marcarAtendido('${p.id}')" class="w-full bg-[#00c2a8] text-[#0a2540] font-semibold py-2 rounded-xl text-sm">
            ✓ Marcar como atendido
          </button>
        </div>
      `).join('');
    } else {
      lista.innerHTML = '<p class="text-center text-slate-500 py-8">Nenhum pedido novo</p>';
    }
  } catch (erro) {
    lista.innerHTML = '<p class="text-center text-red-500 py-8">Erro ao carregar pedidos</p>';
  }
}

async function marcarAtendido(pedidoId) {
  try {
    await fetch('https://microfood.hdmicro.workers.dev/api/pedido-status', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pedido_id: pedidoId, status: 'atendido' })
    });
    carregarPedidos();
  } catch (erro) {
    alert('Erro ao atualizar pedido');
  }
}

// Carregar pedidos ao abrir a aba
document.querySelector('[data-goto="pedidos"]').addEventListener('click', () => {
  setTimeout(carregarPedidos, 300);
});


              </script>
