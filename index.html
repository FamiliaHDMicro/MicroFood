<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="titulo-loja">Carregando...</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#0d0d0d', card: '#121212', roxo: '#1a0f2b',
          laranja: '#ff5500', amarelo: '#ffcc00', verde: '#10b981', vermelho: '#ef4444'
        }
      }
    }
  }
</script>
<style>
  body { background: #0d0d0d; color: #fff; font-family: 'Segoe UI', Arial, sans-serif; }
  .fade-in { animation: fadeIn 0.6s ease-out; }
  @keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
  .card-hover { transition: all 0.3s; }
  .card-hover:hover { transform: translateY(-5px); }
  .tela-oculta { display: none !important; }
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading" class="min-h-screen flex items-center justify-center">
  <div class="text-center">
    <div class="text-6xl mb-4">️</div>
    <div class="text-2xl font-bold text-laranja">Carregando loja...</div>
    <div class="text-sm text-gray-500 mt-2" id="debug-info">Buscando dados...</div>
  </div>
</div>

<!-- ERRO -->
<div id="erro" class="tela-oculta min-h-screen flex items-center justify-center">
  <div class="text-center">
    <div class="text-6xl mb-4">😕</div>
    <div class="text-2xl font-bold text-vermelho mb-2">Loja não encontrada</div>
    <div class="text-gray-400 mb-2">Este endereço não existe ou foi desativado.</div>
    <div class="text-sm text-gray-600 mb-6" id="erro-detalhe"></div>
    <a href="https://microfood.pages.dev" class="inline-block bg-laranja px-6 py-3 rounded-lg font-bold hover:bg-orange-600">Voltar ao SiteOne</a>
  </div>
</div>

<!-- CONTEÚDO DA LOJA -->
<div id="conteudo-loja" class="tela-oculta"></div>

<script>
const WORKER_URL = 'https://microfood.hdmicro.workers.dev';

console.log('🚀 loja.html carregado');

// ============================================================
// TEMPLATES
// ============================================================
const templatesHTML = {
  'sabor-caseiro': renderSaborCaseiro,
  'loja-virtual': renderLojaVirtual,
  'consult-pro': renderConsultPro,
  'barber-shop': renderBarberShop,
  'delivery-rapido': renderDeliveryRapido,
  'mesa-farta': renderMesaFarta,
  'glamour-studio': renderGlamourStudio,
  'beauty-express': renderBeautyExpress,
  'mao-na-massa': renderMaoNaMassa,
  'tech-solutions': renderTechSolutions,
  'limpeza-total': renderLimpezaTotal,
  'eventos-plus': renderEventosPlus
};

function renderLojaVirtual(loja, midias) {
  const fotos = (midias || []).filter(m => m.tipo === 'foto');
  const videos = (midias || []).filter(m => m.tipo === 'video');
  
  let produtos = '';
  if (fotos.length > 0) {
    produtos = fotos.map(f => `
      <div class="card-hover bg-card rounded-2xl overflow-hidden border border-roxo">
        <img src="${f.url}" alt="Produto" class="w-full h-48 object-cover">
        <div class="p-4">
          <div class="font-bold text-lg">Produto</div>
          <div class="text-laranja font-black text-xl mt-2">R$ --</div>
          <a href="https://wa.me/${loja.zap}" target="_blank" class="block mt-3 bg-laranja text-white text-center py-2 rounded-lg font-bold hover:bg-orange-600">Comprar</a>
        </div>
      </div>
    `).join('');
  } else {
    produtos = `
      <div class="col-span-full text-center py-12 bg-roxo rounded-2xl">
        <div class="text-6xl mb-4">🛒</div>
        <div class="text-xl text-gray-400">Produtos em breve!</div>
        <div class="text-sm text-gray-500 mt-2">O vendedor ainda não adicionou produtos.</div>
      </div>
    `;
  }

  return `
    <div class="bg-gradient-to-r from-blue-900 to-purple-900 py-16 text-center fade-in">
      <div class="text-6xl mb-4">🛍️</div>
      <h1 class="text-5xl font-black text-white mb-4">${loja.nome_loja}</h1>
      <p class="text-xl text-blue-200">Sua loja online completa</p>
      <a href="https://wa.me/${loja.zap}" target="_blank" class="inline-block mt-6 bg-green-500 hover:bg-green-600 text-white px-8 py-4 rounded-full font-bold text-lg shadow-2xl">💬 Pedir pelo WhatsApp</a>
    </div>
    <div class="max-w-6xl mx-auto px-4 py-12">
      <h2 class="text-3xl font-black text-laranja mb-6">Produtos</h2>
      <div class="grid md:grid-cols-3 gap-6">${produtos}</div>
    </div>
    ${videos.length > 0 ? `
    <div class="max-w-6xl mx-auto px-4 pb-12">
      <h2 class="text-3xl font-black text-laranja mb-6">Vídeos</h2>
      <div class="grid md:grid-cols-2 gap-6">
        ${videos.map(v => `<div class="card-hover rounded-2xl overflow-hidden bg-card border border-roxo"><iframe src="${v.url}" class="w-full h-64" frameborder="0" allowfullscreen></iframe></div>`).join('')}
      </div>
    </div>` : ''}
    <footer class="bg-black py-6 text-center text-gray-500 text-sm">Powered by <strong class="text-laranja">SiteOne</strong> • microfood.pages.dev</footer>
  `;
}

function renderSaborCaseiro(loja, midias) {
  const fotos = (midias || []).filter(m => m.tipo === 'foto');
  let galeria = fotos.length > 0 
    ? fotos.map(f => `<div class="card-hover rounded-2xl overflow-hidden shadow-2xl"><img src="${f.url}" class="w-full h-64 object-cover"></div>`).join('')
    : `<div class="col-span-full text-center py-12 bg-roxo rounded-2xl"><div class="text-6xl mb-4">🍽️</div><div class="text-xl text-gray-400">Fotos em breve!</div></div>`;

  return `
    <div class="relative h-96 bg-gradient-to-br from-orange-900 via-red-900 to-amber-900 flex items-center justify-center overflow-hidden fade-in">
      <div class="absolute inset-0 opacity-20" style="background-image: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%2250%22 font-size=%2280%22>🍲</text></svg>'); background-size: 100px;"></div>
      <div class="relative text-center px-4">
        <div class="text-6xl mb-4">🍲</div>
        <h1 class="text-5xl md:text-6xl font-black text-white mb-2">${loja.nome_loja}</h1>
        <p class="text-xl text-amber-200">Feito com amor, entregue com carinho</p>
        <a href="https://wa.me/${loja.zap}" target="_blank" class="inline-block mt-6 bg-green-500 hover:bg-green-600 text-white px-8 py-4 rounded-full font-bold text-lg shadow-2xl">💬 Pedir pelo WhatsApp</a>
      </div>
    </div>
    <div class="max-w-4xl mx-auto px-4 py-12">
      <div class="bg-card rounded-2xl p-8 border border-roxo">
        <h2 class="text-3xl font-black text-laranja mb-4">Sobre nós</h2>
        <p class="text-gray-300 text-lg">Bem-vindo à <strong class="text-white">${loja.nome_loja}</strong>! Preparamos cada prato com ingredientes frescos e muito carinho.</p>
      </div>
    </div>
    <div class="max-w-6xl mx-auto px-4 pb-12">
      <h2 class="text-3xl font-black text-laranja mb-6 text-center">Nossas delícias</h2>
      <div class="grid md:grid-cols-3 gap-6">${galeria}</div>
    </div>
    <footer class="bg-black py-6 text-center text-gray-500 text-sm">Powered by <strong class="text-laranja">SiteOne</strong></footer>
  `;
}

function renderDefault(loja, midias, emoji, cor1, cor2) {
  return `
    <div class="bg-gradient-to-r ${cor1} ${cor2} py-16 text-center fade-in">
      <div class="text-6xl mb-4">${emoji}</div>
      <h1 class="text-5xl font-black text-white mb-4">${loja.nome_loja}</h1>
      <p class="text-xl text-gray-200">Template em desenvolvimento</p>
      <a href="https://wa.me/${loja.zap}" target="_blank" class="inline-block mt-6 bg-green-500 text-white px-8 py-4 rounded-full font-bold">💬 WhatsApp</a>
    </div>
    <footer class="bg-black py-6 text-center text-gray-500 text-sm">Powered by <strong class="text-laranja">SiteOne</strong></footer>
  `;
}

function renderConsultPro(loja, m) { return renderDefault(loja, m, '💼', 'from-slate-900', 'to-gray-900'); }
function renderBarberShop(loja, m) { return renderDefault(loja, m, '💈', 'from-gray-900', 'to-black'); }
function renderDeliveryRapido(loja, m) { return renderDefault(loja, m, '🚀', 'from-red-900', 'to-orange-900'); }
function renderMesaFarta(loja, m) { return renderDefault(loja, m, '🍽️', 'from-amber-900', 'to-yellow-900'); }
function renderGlamourStudio(loja, m) { return renderDefault(loja, m, '✨', 'from-purple-900', 'to-pink-900'); }
function renderBeautyExpress(loja, m) { return renderDefault(loja, m, '💅', 'from-pink-900', 'to-rose-900'); }
function renderMaoNaMassa(loja, m) { return renderDefault(loja, m, '🔧', 'from-orange-900', 'to-amber-900'); }
function renderTechSolutions(loja, m) { return renderDefault(loja, m, '💻', 'from-blue-900', 'to-cyan-900'); }
function renderLimpezaTotal(loja, m) { return renderDefault(loja, m, '🧹', 'from-green-900', 'to-teal-900'); }
function renderEventosPlus(loja, m) { return renderDefault(loja, m, '🎉', 'from-fuchsia-900', 'to-purple-900'); }

// ============================================================
// CARREGAR LOJA
// ============================================================
async function carregarLoja() {
  const params = new URLSearchParams(window.location.search);
  const subdomain = params.get('subdomain');
  
  console.log('📍 Subdomain da URL:', subdomain);
  document.getElementById('debug-info').textContent = 'Subdomain: ' + (subdomain || 'vazio');
  
  if (!subdomain) {
    console.error('❌ Sem subdomain na URL');
    document.getElementById('loading').classList.add('tela-oculta');
    document.getElementById('erro').classList.remove('tela-oculta');
    document.getElementById('erro-detalhe').textContent = 'URL sem parâmetro ?subdomain=';
    return;
  }

  try {
    const url = WORKER_URL + '/api/ver?subdomain=' + encodeURIComponent(subdomain);
    console.log('🔗 Chamando:', url);
    document.getElementById('debug-info').textContent = 'Chamando API...';
    
    const resposta = await fetch(url);
    console.log('📡 Status:', resposta.status);
    
    const dados = await resposta.json();
    console.log('📦 Dados:', dados);
    
    if (!resposta.ok || !dados.sucesso) {
      throw new Error(dados.erro || 'Loja não encontrada na API');
    }

    const loja = dados.loja;
    const midias = dados.midias || [];
    const templateId = loja.template_id || 'consult-pro';
    
    console.log(' Template:', templateId);
    document.getElementById('debug-info').textContent = 'Template: ' + templateId;
    
    const renderFn = templatesHTML[templateId] || renderDefault;

    document.getElementById('titulo-loja').textContent = loja.nome_loja;
    document.getElementById('conteudo-loja').innerHTML = renderFn(loja, midias);
    document.getElementById('loading').classList.add('tela-oculta');
    document.getElementById('conteudo-loja').classList.remove('tela-oculta');
    console.log('✅ Loja carregada com sucesso!');

  } catch (erro) {
    console.error('❌ Erro:', erro);
    document.getElementById('loading').classList.add('tela-oculta');
    document.getElementById('erro').classList.remove('tela-oculta');
    document.getElementById('erro-detalhe').textContent = 'Erro: ' + erro.message;
  }
}

carregarLoja();
</script>
</body>
</html>
